services:
  - type: web
    name: cpmonline-backend
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.nphhtnndxkkjodzyoacw
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SHOW_SQL
        value: false
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=112m -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
