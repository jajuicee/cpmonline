# --- SERVER CONFIG ---
server.address=0.0.0.0
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=365d

# --- EMBEDDED TOMCAT THREAD & BUFFER POOL (OPTIMIZED FOR 512MB RAM) ---
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:25}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:4}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=20

# --- DATASOURCE CONFIG ---
# Supabase PostgreSQL via Session Pooler (port 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.nphhtnndxkkjodzyoacw}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qrEEOtsgqwRLr7qx}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIKARI CONNECTION POOL (OPTIMIZED FOR 512MB RAM) ---
# Small pool saves tens of MBs of JDBC buffer allocations on small cloud containers
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=900000

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:cpm0nl1ne-s3cur3-jwt-k3y-th4t-1s-l0ng-en0ugh-f0r-hs256-alg0r1thm!}
jwt.expiration-ms=86400000

# --- LOGGING ---
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BINDER_LOG_LEVEL:WARN}