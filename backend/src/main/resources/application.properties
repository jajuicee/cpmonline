server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=365d

# --- DATASOURCE CONFIG ---
# Supabase PostgreSQL via Session Pooler (port 5432)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.nphhtnndxkkjodzyoacw
spring.datasource.password=qrEEOtsgqwRLr7qx
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIKARI CONNECTION POOL ---
# Direct connection mode supports more concurrent connections than the pooler.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

